<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <!-- The envelope of favicon.svg as an alpha-only silhouette: Android paints every opaque pixel of a notification badge white. -->
  <mask id="crease">
    <rect width="96" height="96" fill="white"/>
    <polyline points="17.4,33.3 48,57.9 78.6,33.3" stroke="black" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </mask>
  <rect x="16.5" y="30.6" width="63" height="43.2" rx="8.1" fill="#ffffff" mask="url(#crease)"/>
</svg>

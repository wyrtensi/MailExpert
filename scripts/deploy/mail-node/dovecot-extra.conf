# Dovecot settings for a mailcow node that serves MailExpert (docs/operations/mail-node.md, section 3).
# Copy to data/conf/dovecot/extra.conf on the node, then: docker compose restart dovecot-mailcow.
# Dovecot 2.3 syntax (mailcow 2026-09 ships 2.3.21).

# High-performance login mode: a few imap-login processes proxy all TLS connections, instead of one
# process per connection (about 7 MB each). One login process then serves several mailboxes; that is
# acceptable here because port 993 is open to the panel only (section 4).
service imap-login {
  service_count = 0
  process_min_avail = 4
}

# The panel keeps up to two sessions per mailbox (IDLE and sync), about 1000 at 500 mailboxes: above
# mailcow's default limit of 1024 processes once a few more are open.
service imap {
  process_limit = 2048
  unix_listener imap-master {
    user = $default_internal_user
  }
  extra_groups = $default_internal_group
}

# A session that sits in IDLE leaves its own imap process for the shared imap-hibernate process and
# comes back when the mailbox changes or the panel sends a command. Dovecot 2.3 cannot hibernate a
# session with COMPRESS on; MailExpert does not turn it on for mail node mailboxes.
imap_hibernate_timeout = 10s
service imap-hibernate {
  unix_listener imap-hibernate {
    mode = 0660
    group = $default_internal_group
  }
}

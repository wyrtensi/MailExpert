# me-bench dovecot config — maildir, passwd-file auth, TLS on 993, tuned for ~600
# concurrent long-lived IMAP IDLE connections from a single benchmark host.

protocols = imap

mail_location = maildir:~/Maildir
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000

disable_plaintext_auth = no
auth_mechanisms = plain login

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%u
}

ssl = yes
ssl_cert = </etc/ssl/certs/ssl-cert-snakeoil.pem
ssl_key = </etc/ssl/private/ssl-cert-snakeoil.key

namespace inbox {
  inbox = yes
  separator = /
}

# Default is 10 — one benchmark client per user is 1 conn/user so this never binds,
# but raised anyway to document the production knob MailExpert's own comments reference.
mail_max_userip_connections = 20

# imap-login terminates TLS and, for a TLS/SSL connection, stays alive for the WHOLE
# session as a "TLS proxy" relaying decrypted traffic to the imap process — confirmed
# via `docker top` (each connection shows one imap-login process, not just a transient
# one during auth). So on 993/TLS this is a second steady-state process per mailbox,
# same order as `service imap` below, not just a login-burst cap.
service imap-login {
  process_limit = 700
}

# One "imap" process per authenticated, IDLE-ing session — this is the steady-state
# cap and must cover every concurrent mailbox (500 mailboxes + headroom).
service imap {
  process_limit = 700
}

# auth and anvil are shared, low-process-count services that each login/logout talks
# to; raise their client_limit so a fast ramp to 500 logins doesn't queue on them.
service auth {
  client_limit = 1200
}
service anvil {
  client_limit = 1200
}

listen = *
log_path = /dev/stdout
info_log_path = /dev/stdout
debug_log_path = /dev/stdout
verbose_proctitle = yes
